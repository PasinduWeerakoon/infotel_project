<text x="471.42857142857144" y="310" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#232F3E" text-anchor="middle">1. Scan the Spin the Wheel or Lucky Dip logo, sign in</text>
<path d="M677.1428571428571 374 H1082.5714285714287" fill="none" stroke="#232F3E" stroke-width="3.6" marker-end="url(#mS)"/>
<rect x="669.6571428571428" y="348" width="426.4" height="22" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="882.8571428571429" y="364" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#232F3E" text-anchor="middle">2. POST scan event (signed, scan ID, user ID, logo ID)</text>
<path d="M1088.5714285714287 428 H2316.857142857143" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#mA)"/>
<rect x="1538.1142857142859" y="402" width="335.2" height="22" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="1705.7142857142858" y="418" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#232F3E" text-anchor="middle">3. Store the scan once (conditional write)</text>
<path d="M677.1428571428571 482 H271.7142857142857" fill="none" stroke="#232F3E" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#mA)"/>
<rect x="265.8285714285714" y="456" width="411.2" height="22" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="471.42857142857144" y="472" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#232F3E" text-anchor="middle">4. Redirect to /auth/callback (code, scan ID, state)</text>
<path d="M265.7142857142857 536 H1494.0" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#mA)"/>
<rect x="795.0571428571429" y="510" width="175.6" height="22" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="882.8571428571429" y="526" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#232F3E" text-anchor="middle">5. GET /auth/callback</text>
<path d="M1500.0 590 H683.1428571428571" fill="none" stroke="#232F3E" stroke-width="3.6" marker-end="url(#mS)"/>
<rect x="905.7714285714285" y="564" width="365.59999999999997" height="22" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="1088.5714285714284" y="580" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#232F3E" text-anchor="middle">6. Exchange code for ID token (opaque user ID)</text>
<path d="M1500.0 644 H271.7142857142857" fill="none" stroke="#232F3E" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#mA)"/>
<rect x="749.4571428571429" y="618" width="266.79999999999995" height="22" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="882.8571428571429" y="634" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#232F3E" text-anchor="middle">7. Set session cookie, open /play</text>
<path d="M265.7142857142857 698 H1905.4285714285716" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#mA)"/>
<rect x="958.9714285714286" y="672" width="259.2" height="22" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="1088.5714285714287" y="688" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#232F3E" text-anchor="middle">8. POST /entries (scan ID, game)</text>
<path d="M1911.4285714285716 752 H2316.857142857143" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#mA)"/>
<rect x="1698.7428571428572" y="726" width="836.8" height="22" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="2117.1428571428573" y="742" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#232F3E" text-anchor="middle">9. One transaction: scan is this user's and unused, session open, no play yet this session, take screen lock</text>
<rect x="66" y="788" width="202.0" height="30" rx="0" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.4"/>
<text x="78" y="809" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#232F3E" text-anchor="start">alt  any check fails</text>
<path d="M1911.4285714285716 852 H271.7142857142857" fill="none" stroke="#232F3E" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#mA)"/>
<rect x="768.9714285714288" y="826" width="639.1999999999999" height="22" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="1088.5714285714287" y="842" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#232F3E" text-anchor="middle">10. 409 with reason: already played this session, game in progress, session closed</text>
<rect x="66" y="788" width="2868" height="108" rx="0" fill="none" stroke="#232F3E" stroke-width="1.6"/>
<path d="M1911.4285714285716 932 H2728.285714285714" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#mA)"/>
<rect x="2140.057142857143" y="906" width="365.59999999999997" height="22" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="2322.857142857143" y="922" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#232F3E" text-anchor="middle">11. Get ready: screen reserved (no name shown)</text>
<path d="M265.7142857142857 986 H1905.4285714285716" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#mA)"/>
<rect x="844.9714285714286" y="960" width="487.2" height="22" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="1088.5714285714287" y="976" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#232F3E" text-anchor="middle">12. POST /entries/{id}/play (a repeat returns the same result)</text>
<path d="M1911.4285714285716 1040 H2316.857142857143" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#mA)"/>
<rect x="1808.9428571428573" y="1014" width="616.4" height="22" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="2117.1428571428573" y="1030" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#232F3E" text-anchor="middle">13. Weighted random draw from remaining session prizes, save play and reference</text>
<path d="M1911.4285714285716 1094 H2728.285714285714" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#mA)"/>
<rect x="2113.457142857143" y="1068" width="418.79999999999995" height="22" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="2322.857142857143" y="1084" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#232F3E" text-anchor="middle">14. Animation target and result (never the reference)</text>
<path d="M1911.4285714285716 1148 H271.7142857142857" fill="none" stroke="#232F3E" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#mA)"/>
<rect x="871.5714285714287" y="1122" width="434.0" height="22" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="1088.5714285714287" y="1138" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#232F3E" text-anchor="middle">15. Prize and reference, phone moves to the result page</text>
<path d="M2734.285714285714 1202 H2328.857142857143" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#mA)"/>
<rect x="2277.3714285714286" y="1176" width="502.4" height="22" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="2528.5714285714284" y="1192" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#232F3E" text-anchor="middle">16. Animation finished: release the screen lock (via Screen API)</text>
<text x="60" y="1360" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#545B64" text-anchor="start">Rules enforced on the server: the scan must come from QuickLook's scan event, one play per user per session across both games, one player per stall screen,</text>
<text x="60" y="1384" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#545B64" text-anchor="start">and every repeated request (refresh, double tap) returns the stored result.</text>
</svg>