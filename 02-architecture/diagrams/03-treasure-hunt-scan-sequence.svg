<text x="60" y="1144" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#545B64" text-anchor="start">Repeat scans of the same stall open the stall offerings but add no points. Scans after the session end are stored but not scored. Staff confirm winners in the LKDR Admin Dashboard.</text>
